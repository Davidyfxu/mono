name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的部署串行执行；PR 的 CI 会被新的提交自动取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Check backend syntax
        run: python -m compileall -q backend/src

  deploy:
    name: Deploy to server
    # PR 只做校验，不部署；只有 push 到 main 或手动触发才部署。
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    # 首次部署需要在服务器本地构建镜像，留足时间。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Upload application to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          # 只同步源码与编排文件；服务器上的 .env 不会被覆盖。
          source: "backend,frontend,docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Rebuild and restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"

            if [ ! -f .env ]; then
              echo "::error::缺少 $PWD/.env，请先在服务器创建生产环境变量文件。"
              exit 1
            fi

            docker compose -f docker-compose.yml up -d --build --remove-orphans
            docker compose -f docker-compose.yml ps

            echo "等待服务通过健康检查..."
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.yml exec -T web wget -qO- http://127.0.0.1/health >/dev/null 2>&1; then
                echo "健康检查通过。"
                docker image prune -f >/dev/null
                exit 0
              fi
              sleep 3
            done

            echo "::error::健康检查失败，输出最近日志。"
            docker compose -f docker-compose.yml logs --tail=120
            exit 1
