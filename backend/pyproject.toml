[project]
name = "backend"
version = "0.1.0"
description = "Task board CRUD API powered by FastAPI and Prisma"
readme = "README.md"
authors = [
    { name = "davidyfxu", email = "s200048@e.ntu.edu.sg" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "prisma>=0.15.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
backend = "main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
